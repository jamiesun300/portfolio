<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost in Translation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0D0D0D;
    --red: #B91C1C;
    --cream: #f0ede8;
    --gray: #888;
    --border: #e8e3dc;
  }

  body {
    background: var(--cream);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    padding: 18px 48px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(240,237,232,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.07);
  }
  .nav-logo { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .nav-back {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gray); text-decoration: none; transition: color 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .nav-back:hover { color: var(--ink); }

  /* ── SECTION LABEL ── */
  .sec-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gray);
    margin-bottom: 24px;
  }
  .sec-label::before { content: ''; width: 24px; height: 1px; background: var(--red); flex-shrink: 0; }

  /* ════════════════════════
     1. SPLIT HERO
  ════════════════════════ */
  .hero {
    margin-top: 62px;
    display: grid; grid-template-columns: 1fr 1fr;
    height: 520px;
  }
  .hero-left {
    background: var(--ink); padding: 56px 52px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .hero-tag {
    font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(255,255,255,0.3); margin-bottom: 16px;
  }
  .hero-zh {
    font-size: 108px; font-weight: 700; color: white;
    line-height: 0.9; letter-spacing: -0.03em;
  }
  .hero-pinyin {
    font-size: 14px; color: rgba(255,255,255,0.4);
    margin-top: 16px; letter-spacing: 0.08em;
  }
  .hero-en {
    font-size: 14px; color: rgba(255,255,255,0.55);
    margin-top: 8px; font-style: italic; letter-spacing: 0.02em;
  }

  /* ── PHOTO SLIDESHOW ── */
  .hero-right { position: relative; overflow: hidden; background: #1a1a1a; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  .slide.active { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05) saturate(0.85); }
  .slide-dots {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 10;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.3); cursor: pointer;
    transition: background 0.3s; border: none; padding: 0;
  }
  .dot.active { background: white; }

  /* ════════════════════════
     2. CONTENT COLUMNS
  ════════════════════════ */
  .content-row {
    display: grid; grid-template-columns: 1fr 1fr;
    background: white; border-bottom: 1px solid var(--border);
  }
  .content-col { padding: 52px 56px; border-right: 1px solid var(--border); }
  .content-col:last-child { border-right: none; }
  .content-col p { font-size: 14px; line-height: 1.9; color: #333; }
  .content-col p + p { margin-top: 16px; }
  .pull-quote {
    margin-top: 28px; padding-left: 18px;
    border-left: 2px solid var(--red);
    font-size: 13px; font-style: italic; color: #555; line-height: 1.75;
  }

  /* ════════════════════════
     3. PHOTO STRIP
  ════════════════════════ */
  .strip { display: flex; background: var(--ink); height: 300px; overflow: hidden; }
  .strip-anchor {
    width: 72px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .strip-anchor span {
    writing-mode: vertical-rl;
    font-size: 38px; font-weight: 700; color: white;
    letter-spacing: -0.02em; line-height: 1;
  }
  .strip-photos { flex: 1; overflow: hidden; display: flex; align-items: stretch; padding: 16px 0; }
  .strip-track {
    display: flex; gap: 3px;
    animation: scrollTrack 22s linear infinite;
    align-items: stretch; padding: 0 16px; will-change: transform;
  }
  .strip-track:hover { animation-play-state: paused; }
  @keyframes scrollTrack {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .strip-photo { flex-shrink: 0; position: relative; overflow: hidden; background: #333; }
  .strip-photo img {
    height: 100%; width: 100%; object-fit: cover;
    filter: grayscale(20%) contrast(1.05); transition: filter 0.5s, transform 0.6s;
  }
  .strip-photo:hover img { filter: grayscale(0%); transform: scale(1.04); }
  .strip-fade {
    width: 56px; flex-shrink: 0;
    background: linear-gradient(to right, transparent, var(--ink));
    pointer-events: none;
  }

  /* ════════════════════════
     4. REAL-LIFE EXAMPLES
  ════════════════════════ */
  .examples { background: #f8f6f2; padding: 56px 80px; border-bottom: 1px solid var(--border); }
  .example-item {
    padding: 22px 26px; border-left: 2px solid var(--border);
    margin-bottom: 14px; background: white; transition: border-color 0.3s;
  }
  .example-item:hover { border-left-color: var(--red); }
  .example-item:last-child { margin-bottom: 0; }
  .example-item p { font-size: 14px; font-style: italic; color: #333; line-height: 1.85; }
  .ex-tag { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #bbb; margin-top: 10px; }

  /* ════════════════════════
     5. PILE MOTION
  ════════════════════════ */
  .typo-motion { position: relative; height: 680px; overflow: hidden; background: #080808; }
  .pile-label {
    position: absolute; top: 32px; left: 48px; z-index: 20;
    font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }
  .pile-canvas { position: absolute; inset: 0; }

  /* ════════════════════════
     6. RELATED WORDS
  ════════════════════════ */
  .related { padding: 52px 80px; background: white; border-top: 1px solid var(--border); }
  .related-cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .related-card {
    padding: 14px 22px; border: 1.5px solid var(--ink);
    border-radius: 2px; cursor: pointer; text-decoration: none;
    display: block; transition: background 0.25s;
  }
  .related-card:hover { background: var(--ink); }
  .related-card:hover .rc-pinyin { color: rgba(255,255,255,0.4); }
  .related-card:hover .rc-zh { color: white; }
  .rc-pinyin { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; }
  .rc-zh { font-size: 24px; font-weight: 700; margin-top: 3px; color: var(--ink); }

  /* ── NOT FOUND ── */
  .not-found {
    margin-top: 62px; padding: 120px 80px;
    text-align: center;
  }
  .not-found h2 { font-size: 48px; font-weight: 700; margin-bottom: 16px; }
  .not-found p { font-size: 14px; color: var(--gray); }
  .not-found a { color: var(--red); text-decoration: none; }
</style>

  /* ── PILE ANIMATION ── */
  const illustrations = word.imgs || IMGS;
  const ALL = [...illustrations, ...word.pileWords];
  const pileCanvas = document.getElementById('pileCanvas');

  function spawnItem(def) {
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute; pointer-events:none;';

    if (def.src) {
      const img = document.createElement('img');
      img.src = def.src;
      const f = def.invert ? 'invert(1)' : def.redBlack ? 'invert(1) hue-rotate(180deg)' : 'none';
      img.style.cssText = `width:${def.w}px; filter:${f}; display:block;`;
      if (def.redBlack || def.screen) img.style.mixBlendMode = 'screen';
      el.appendChild(img);
    } else {
      el.style.fontWeight  = '700';
      el.style.lineHeight  = '1';
      el.style.fontSize    = def.fs + 'px';
      el.style.color       = def.color;
      if (def.ls)     el.style.letterSpacing = def.ls;
      if (def.italic) el.style.fontStyle     = 'italic';
      el.textContent = def.text;
    }

    const startX = 5 + Math.random() * 80;
    const startR = (Math.random() - 0.5) * 60;
    const landR  = (Math.random() - 0.5) * 35;
    const landY  = 30 + Math.random() * 40;

    el.style.left       = startX + '%';
    el.style.top        = '-220px';
    el.style.opacity    = '0';
    el.style.transform  = `rotate(${startR}deg)`;
    el.style.transition = 'none';
    pileCanvas.appendChild(el);
    el.getBoundingClientRect();

    el.style.transition = `top 0.75s cubic-bezier(0.34,1.25,0.64,1),
                            transform 0.75s cubic-bezier(0.34,1.25,0.64,1),
                            opacity 0.25s ease`;
    el.style.top       = landY + '%';
    el.style.opacity   = '1';
    el.style.transform = `rotate(${landR}deg)`;

    const slideDelay = 900 + Math.random() * 700;
    setTimeout(() => {
      el.style.transition = `top 2.2s ease-in, left 2.2s ease-in,
                              opacity 0.9s ease-in 1.3s, transform 2.2s ease-in`;
      el.style.top       = '105%';
      el.style.left      = (-5 - Math.random() * 15) + '%';
      el.style.opacity   = '0';
      el.style.transform = `rotate(${landR + (Math.random() - 0.5) * 25}deg)`;
    }, slideDelay);

    setTimeout(() => {
      el.remove();
      setTimeout(() => spawnItem(def), 400 + Math.random() * 800);
    }, slideDelay + 2400);
  }

  const pileSection = document.querySelector('.typo-motion');
  let pileStarted = false;
  new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !pileStarted) {
        pileStarted = true;
        ALL.forEach((def, i) => setTimeout(() => spawnItem(def), i * 180));
      }
    });
  }, { threshold: 0.1 }).observe(pileSection);
}
</script>
</body>
</html>
